<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSS APROVA | Acadêmico Premium</title><style>:root{--primary:#244e91;--navy:#112c50;--bg:#f3f6fb;--ink:#172b48;--muted:#64748b;font-family:system-ui,-apple-system,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button{cursor:pointer;border:0;border-radius:10px;padding:12px 15px;font-weight:650;background:var(--primary);color:white}button:disabled{opacity:.45}button.alt{background:#e9f0fa;color:#214675}a{color:#1f58a1}aside{position:fixed;inset:0 auto 0 0;width:238px;background:var(--navy);color:white;padding:22px 13px;overflow:auto}aside h2{padding:0 12px}aside button{display:block;width:100%;background:transparent;text-align:left;color:#d9e7fa;margin:4px 0}aside button.active{background:#30558a;color:white}main{margin-left:238px;padding:27px;max-width:1450px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:white;border:1px solid #dfe6f0;border-radius:17px;padding:22px;margin:15px 0;box-shadow:0 3px 12px #1c3d6a09}.hero{background:linear-gradient(120deg,#142f57,#2d62a5);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}.grid .card{margin:0}.muted{color:var(--muted)}.pill{display:inline-block;background:#e9f1ff;color:#24569a;border-radius:99px;padding:5px 10px;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.bar{height:10px;border-radius:10px;background:#e3ebf5;overflow:hidden}.bar div{height:100%;background:var(--primary)}.option{display:block;border:1px solid #dce5ef;padding:12px;border-radius:10px;margin:9px 0;cursor:pointer}.option:has(input:checked){border-color:var(--primary);background:#f1f6ff}input,select{padding:10px;border:1px solid #cbd6e6;border-radius:9px;max-width:100%}.lesson{line-height:1.75;font-size:18px}.medal{font-size:35px}.photo{width:58px;height:58px;object-fit:cover;border-radius:50%;background:#e4eaf4}.small{font-size:13px}.notice{border-left:4px solid #b78b24;padding:12px;background:#fff9e9;border-radius:8px}@media(max-width:720px){aside{position:static;width:auto;padding:12px;display:flex;flex-wrap:wrap;gap:3px}aside h2{width:100%;margin:3px 0 7px}aside button{width:auto;font-size:12px;padding:10px}main{margin:0;padding:15px}.card{padding:17px}.top h1{font-size:24px}} </style></head><body><aside><h2>🎓 INSS APROVA</h2><div id="nav"></div></aside><main id="app"></main><script>
const subjects=[['Direito Previdenciário',['Seguridade social','RGPS: segurados','Dependentes e filiação','Carência e qualidade de segurado','Benefícios e serviços','Financiamento da seguridade','BPC/LOAS']],['Língua Portuguesa',['Interpretação textual','Ortografia e acentuação','Classes de palavras','Sintaxe e pontuação','Concordância e regência','Redação oficial']],['Ética no Serviço Público',['Ética e moral','Decreto 1.171/1994','Conduta do servidor']],['Direito Constitucional',['Direitos fundamentais','Direitos sociais','Administração pública','Seguridade na Constituição']],['Direito Administrativo',['Princípios administrativos','Atos e poderes','Agentes públicos','Lei 8.112/1990','Processo administrativo']],['Informática',['Sistemas operacionais','Internet e correio eletrônico','Segurança da informação','Ferramentas de escritório']],['Raciocínio Lógico',['Proposições','Conectivos','Tabelas-verdade','Argumentação e conjuntos']]];
const modules=[{s:0,title:'Seguridade social: fundamentos',slides:[['Conceito constitucional','A seguridade social é um conjunto integrado de ações dos Poderes Públicos e da sociedade destinado a assegurar direitos relativos à saúde, previdência e assistência social.','CF/1988, art. 194'],['Saúde','A saúde é direito de todos e dever do Estado. O acesso ao SUS não depende de contribuição previdenciária.','CF/1988, art. 196'],['Previdência','O Regime Geral de Previdência Social é contributivo e de filiação obrigatória para os segurados abrangidos, conforme regras legais.','CF/1988, art. 201'],['Assistência','A assistência social é prestada a quem dela necessitar, independentemente de contribuição à seguridade social.','CF/1988, art. 203'],['BPC','O Benefício de Prestação Continuada é assistencial, não aposentadoria, e exige requisitos legais específicos.','Lei 8.742/1993, art. 20'],['Objetivos da seguridade','Entre os objetivos estão universalidade da cobertura e do atendimento, seletividade e distributividade e diversidade da base de financiamento.','CF/1988, art. 194, parágrafo único']] ,questions:[['A seguridade social compreende saúde, previdência e assistência social.',true,'CF, art. 194'],['O atendimento pelo SUS depende de contribuição prévia ao INSS.',false,'CF, art. 196'],['O RGPS possui caráter contributivo.',true,'CF, art. 201'],['A assistência social exige contribuição previdenciária.',false,'CF, art. 203'],['O BPC é uma aposentadoria do RGPS.',false,'Lei 8.742/1993, art. 20'],['A universalidade da cobertura e do atendimento é objetivo da seguridade social.',true,'CF, art. 194'],['A diversidade da base de financiamento é um objetivo da seguridade social.',true,'CF, art. 194'],['A saúde é direito de todos e dever do Estado.',true,'CF, art. 196'],['A previdência social e a assistência social possuem exatamente o mesmo caráter contributivo.',false,'CF, arts. 201 e 203'],['A assistência social integra a seguridade social.',true,'CF, art. 194']]},{s:1,title:'Interpretação de textos: fundamentos',slides:[['Tema e ideia central','O tema é o assunto geral; a ideia central é a principal afirmação defendida ou desenvolvida no texto.','Fundamentos de leitura'],['Informação explícita','É a informação expressa diretamente. A resposta pode ser localizada e conferida no próprio texto.','Estratégias de leitura'],['Inferência','É uma conclusão apoiada em pistas textuais. Inferir não significa inventar dados que o texto não sustenta.','Estratégias de leitura'],['Fato e opinião','Fato é uma afirmação verificável; opinião é uma avaliação ou julgamento do enunciador.','Leitura crítica'],['Conectores','Palavras como porém, portanto e porque sinalizam relações de contraste, conclusão e causa.','Coesão textual']],questions:[['O tema de um texto corresponde ao seu assunto geral.',true,'Tema textual'],['Uma inferência pode contrariar livremente o texto.',false,'Inferência'],['Informação explícita é aquela diretamente enunciada.',true,'Leitura'],['O conectivo “porém” costuma indicar contraste.',true,'Coesão'],['Opinião e fato são sempre equivalentes.',false,'Leitura crítica'],['A ideia central corresponde necessariamente ao título literal.',false,'Interpretação'],['O conectivo “portanto” pode introduzir conclusão.',true,'Coesão'],['É possível identificar pistas textuais para justificar uma inferência.',true,'Inferência'],['Um julgamento subjetivo pode indicar opinião.',true,'Leitura crítica'],['Ler apenas a primeira palavra basta para compreender qualquer texto.',false,'Compreensão textual']]}];
const resources=[['Edital de abertura INSS Técnico 2022 (referência)','https://cdn.cebraspe.org.br/concursos/inss_22/arquivos/ED_1_INSS_22_ABERTURA.PDF'],['Página oficial de editais do INSS','https://www.gov.br/inss/pt-br/centrais-de-conteudo/legislacao/edital'],['Constituição Federal','https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'],['Lei 8.213/1991','https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm'],['Lei 8.212/1991','https://www.planalto.gov.br/ccivil_03/leis/l8212cons.htm'],['Lei 8.112/1990','https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm'],['Lei 8.742/1993','https://www.planalto.gov.br/ccivil_03/leis/l8742.htm']];
const key='inssAprovaPremium2';let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){data={}}data={name:'Estudante',color:'#244e91',goal:60,photo:'',scores:[],completed:[],minutes:0,...data};let page='inicio',selected=0,slide=0,q=0,answers={},done=false,started=Date.now();function save(){localStorage.setItem(key,JSON.stringify(data))}function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(p){page=p;render()}function medal(n){return n>=90?'🥇 Ouro':n>=80?'🥈 Prata':n>=70?'🥉 Bronze':'📘 Continue praticando'}function openModule(i){selected=i;slide=0;q=0;answers={};done=false;nav('aula')}function getPct(){return Math.round(data.completed.length/modules.length*100)}function record(){if(modules[selected].questions.some((x,i)=>answers[i]===undefined)){alert('Responda as 10 questões antes de entregar.');return}let correct=modules[selected].questions.filter((x,i)=>x[1]===answers[i]).length;data.scores.push({module:selected,correct,date:new Date().toISOString()});if(!data.completed.includes(selected))data.completed.push(selected);data.minutes+=Math.max(1,Math.round((Date.now()-started)/60000));started=Date.now();save();done=true;render()}
function render(){document.documentElement.style.setProperty('--primary',data.color);const menu=[['inicio','🏠 Painel'],['disciplinas','📚 Disciplinas'],['aula','🖥️ Sala de aula'],['prova','📝 Avaliações'],['simulado','⏱️ Simulado'],['cronograma','🗓️ Cronograma'],['boletim','🏆 Boletim'],['biblioteca','🔗 Biblioteca'],['perfil','👤 Perfil']];document.getElementById('nav').innerHTML=menu.map(x=>`<button class="${page===x[0]?'active':''}" onclick="nav('${x[0]}')">${x[1]}</button>`).join('');let a=document.getElementById('app');if(page==='inicio'){let last=data.scores.at(-1);a.innerHTML=`<div class="card hero"><div class="row"><div><span>CURSINHO PARTICULAR • NÍVEL MÉDIO</span><h1>Olá, ${esc(data.name)}! 👋</h1><p>Seu caminho de preparação para Técnico do Seguro Social.</p><button onclick="openModule(0)">Continuar estudando →</button></div>${data.photo?`<img class="photo" src="${data.photo}" alt="Foto de perfil">`:''}</div></div><div class="grid"><div class="card"><span class="muted">Aulas concluídas</span><h2>${data.completed.length}/${modules.length}</h2><div class="bar"><div style="width:${getPct()}%"></div></div></div><div class="card"><span class="muted">Avaliações</span><h2>${data.scores.length}</h2></div><div class="card"><span class="muted">Tempo registrado</span><h2>${data.minutes} min</h2></div><div class="card"><span class="muted">Última conquista</span><h2>${last?medal(last.correct*10):'—'}</h2></div></div><div class="card"><h2>Próxima aula</h2><p>Direito Previdenciário • Seguridade social: fundamentos</p><button onclick="openModule(0)">Abrir slides e avaliação</button></div><div class="notice">Esta versão traz duas aulas completas de demonstração e o mapa das disciplinas. Os demais conteúdos ainda precisam ser desenvolvidos e revisados. O edital de 2022 é referência, não confirmação de novo edital.</div>`}
else if(page==='disciplinas'){a.innerHTML='<h1>Trilhas por disciplina</h1><p class="muted">Mapa curricular inicial inspirado no edital de 2022; o conteúdo programático definitivo depende do próximo edital.</p><div class="grid">'+subjects.map((s,i)=>`<div class="card"><h3>${s[0]}</h3><p class="small muted">${s[1].map(t=>'• '+t).join('<br>')}</p>${modules.some(m=>m.s===i)?`<button onclick="openModule(${modules.findIndex(m=>m.s===i)})">Abrir aula disponível</button>`:'<span class="pill">Em desenvolvimento</span>'}</div>`).join('')+'</div>'}
else if(page==='aula'){let m=modules[selected],s=m.slides[slide];a.innerHTML=`<div class="row"><h1>${m.title}</h1><span class="pill">Slide ${slide+1} de ${m.slides.length}</span></div><div class="bar"><div style="width:${100*(slide+1)/m.slides.length}%"></div></div><div class="card lesson"><span class="pill">Aula guiada</span><h2>${s[0]}</h2><p>${s[1]}</p><p class="muted small">Referência: ${s[2]}</p></div><div class="row"><button class="alt" ${slide===0?'disabled':''} onclick="slide--;render()">← Anterior</button>${slide===m.slides.length-1?'<button onclick="q=0;nav(\'prova\')">Responder 10 questões →</button>':'<button onclick="slide++;render()">Próximo slide →</button>'}</div>`}
else if(page==='prova'||page==='simulado'){let m=modules[selected];if(page==='simulado'&&!done&&q===0&&Object.keys(answers).length===0){}if(done){let correct=m.questions.filter((x,i)=>x[1]===answers[i]).length;a.innerHTML=`<div class="card"><h1>Resultado: ${correct}/10 (${correct*10}%)</h1><h2>${medal(correct*10)}</h2><p>O gabarito foi liberado após a entrega.</p><button onclick="openModule(selected)">Revisar a aula</button></div>`+m.questions.map((x,i)=>`<div class="card"><b>${i+1}. ${x[0]}</b><p>Sua resposta: ${answers[i]?'Certo':'Errado'} ${answers[i]===x[1]?'✅':'❌'}</p><p><b>Gabarito: ${x[1]?'Certo':'Errado'}</b></p><p class="muted">Comentário / referência: ${x[2]}</p></div>`).join('');return}let x=m.questions[q];a.innerHTML=`<div class="row"><h1>${page==='simulado'?'Treino Cebraspe':'Avaliação da aula'}</h1><span class="pill">Questão ${q+1}/10</span></div><div class="card"><h3>${x[0]}</h3><label class="option"><input type="radio" name="ans" ${answers[q]===true?'checked':''} onchange="answers[${q}]=true"> Certo</label><label class="option"><input type="radio" name="ans" ${answers[q]===false?'checked':''} onchange="answers[${q}]=false"> Errado</label><p class="muted small">O gabarito permanece oculto até responder e entregar todas as questões.</p></div><div class="row"><button class="alt" ${q===0?'disabled':''} onclick="q--;render()">← Voltar</button>${q===9?'<button onclick="record()">Entregar avaliação</button>':'<button onclick="q++;render()">Próxima →</button>'}</div>`}
else if(page==='cronograma'){a.innerHTML=`<h1>Plano de estudos</h1><div class="card"><label>Meta semanal (minutos): <input type="number" id="goal" min="15" max="3000" value="${data.goal}"></label> <button onclick="data.goal=Number(document.getElementById('goal').value)||60;save();render()">Salvar meta</button><p>Tempo registrado neste navegador: ${data.minutes} min</p><div class="bar"><div style="width:${Math.min(100,data.minutes/data.goal*100)}%"></div></div></div><div class="grid">${['Segunda • Previdenciário','Terça • Português','Quarta • Constitucional','Quinta • Administrativo','Sexta • Ética e Informática','Sábado • Raciocínio Lógico','Domingo • Revisão e simulado'].map(x=>`<div class="card"><b>${x}</b><p class="muted">Sugestão: 30–60 minutos + revisão.</p></div>`).join('')}</div><p class="muted">Plano sugerido, personalizável na meta. O controle de tempo é aproximado e local.</p>`}
else if(page==='boletim'){a.innerHTML='<h1>Boletim e troféus</h1><div class="grid"><div class="card"><div class="medal">🥉</div><b>Bronze</b><p>70–79% de acertos</p></div><div class="card"><div class="medal">🥈</div><b>Prata</b><p>80–89% de acertos</p></div><div class="card"><div class="medal">🥇</div><b>Ouro</b><p>90–100% de acertos</p></div></div>'+(data.scores.length?data.scores.slice().reverse().map(x=>`<div class="card"><b>${modules[x.module].title}</b><p>${x.correct}/10 • ${medal(x.correct*10)}</p><span class="muted small">${new Date(x.date).toLocaleString('pt-BR')}</span></div>`).join(''):'<div class="card">Você ainda não concluiu avaliações.</div>')}
else if(page==='biblioteca'){a.innerHTML='<h1>Biblioteca de fontes oficiais</h1><div class="card"><p>Leis, editais e fontes para conferir as aulas e estudar a legislação.</p>'+resources.map(x=>`<p>📖 <a href="${x[1]}" target="_blank" rel="noopener noreferrer">${x[0]} ↗</a></p>`).join('')+'</div><div class="notice">Questões desta versão são autorais de treinamento, não reprodução de provas oficiais. Não há previsão confiável de percentual de chance de cair uma questão específica.</div>'}
else if(page==='perfil'){a.innerHTML=`<h1>Meu perfil</h1><div class="card"><p>Nome de exibição</p><input id="name" value="${esc(data.name)}" maxlength="60"><p>Cor principal</p><input type="color" id="color" value="${data.color}"><p>Foto (salva somente neste navegador)</p><input type="file" id="photo" accept="image/*"><p><button onclick="saveProfile()">Salvar alterações</button></p><p class="muted small">Os dados são salvos apenas neste dispositivo/navegador, sem conta ou sincronização. Não use em computadores compartilhados.</p></div>`}}
function saveProfile(){data.name=document.getElementById('name').value.trim()||'Estudante';data.color=document.getElementById('color').value;let f=document.getElementById('photo').files[0];if(!f){save();render();return}if(f.size>600000){alert('Escolha uma foto menor que 600 KB para salvar localmente.');return}let r=new FileReader();r.onload=()=>{data.photo=r.result;try{save();render()}catch(e){alert('Armazenamento cheio. Tente uma foto menor.')}};r.readAsDataURL(f)}render();</script></body></html>
