<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INSS APROVA | Técnico do Seguro Social</title><style>:root{font-family:Inter,system-ui,Arial;background:#f3f6fb;color:#142943;--primary:#1c4d91}*{box-sizing:border-box}body{margin:0}aside{background:#102d53;color:white;padding:25px;min-height:100vh;width:250px;position:fixed}aside h2{margin:0 0 30px}aside button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#dce7f6;padding:14px;border-radius:9px;cursor:pointer;font-size:15px}aside button:hover,aside button.active{background:#254d7b;color:white}main{margin-left:250px;padding:32px;max-width:1250px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#667b94}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin:24px 0}.card{background:white;border:1px solid #e0e8f1;border-radius:16px;padding:22px;box-shadow:0 4px 15px #173a6209}.card h3{margin-top:0}button.action{background:var(--primary);border:0;color:white;border-radius:9px;padding:12px 18px;cursor:pointer}button.secondary{background:#edf3fb;color:#1d426e;border:1px solid #cbd8e8;padding:11px 16px;border-radius:9px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input,select{padding:11px;border:1px solid #ccd8e6;border-radius:9px;max-width:100%}.option{display:block;border:1px solid #dce5ef;padding:13px;margin:9px 0;border-radius:9px;cursor:pointer}.option:has(input:checked){border-color:var(--primary);background:#eff5ff}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.progress{height:9px;background:#e6edf5;border-radius:20px;overflow:hidden}.progress div{height:100%;background:var(--primary)}.pill{background:#eaf1fb;color:#244f85;padding:6px 10px;border-radius:20px;font-size:12px}.medal{font-size:42px}.slide{background:linear-gradient(135deg,#12335e,#245e9d);color:white;padding:38px;border-radius:15px;min-height:250px;line-height:1.7}.lesson{margin-bottom:12px}.hide{display:none}@media(max-width:700px){aside{position:static;min-height:auto;width:100%;padding:12px}aside h2{margin:4px 0 10px}aside nav{display:flex;overflow:auto}aside button{white-space:nowrap;width:auto}main{margin:0;padding:17px}header{align-items:start}.slide{padding:22px}}</style></head><body><aside><h2>🎓 INSS APROVA</h2><nav id="nav"></nav></aside><main><header><div><h1 id="title">Meu painel</h1><div class="muted">Preparação para Técnico do Seguro Social • edital de referência 2022</div></div><span class="pill" id="username">Estudante</span></header><section id="content"></section></main><script>
const disciplines=[['Direito Previdenciário','Seguridade social','A seguridade social compreende saúde, previdência e assistência social. A saúde é direito de todos; a previdência no RGPS tem caráter contributivo; e a assistência social independe de contribuição.','Constituição Federal, arts. 194, 196, 201 e 203','https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'],['Língua Portuguesa','Interpretação de textos','Interpretar é reconhecer informações explícitas, inferências justificadas pelo texto e relações de sentido. Diferencie fato, opinião e conclusão.','Prática de interpretação textual','https://www.gov.br/inep/pt-br'],['Direito Constitucional','Administração Pública','A administração pública direta e indireta obedece aos princípios da legalidade, impessoalidade, moralidade, publicidade e eficiência.','Constituição Federal, art. 37','https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm'],['Direito Administrativo','Servidores públicos federais','A Lei nº 8.112/1990 dispõe sobre o regime jurídico dos servidores públicos civis da União, autarquias e fundações públicas federais.','Lei nº 8.112/1990','https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm'],['Ética no Serviço Público','Conduta ética','O servidor deve agir com zelo, respeito ao cidadão e responsabilidade no exercício de suas atribuições.','Decreto nº 1.171/1994','https://www.planalto.gov.br/ccivil_03/decreto/d1171.htm'],['Informática','Segurança da informação','Confidencialidade, integridade e disponibilidade são fundamentos de segurança da informação. Use autenticação forte e evite links suspeitos.','Cartilha de Segurança para Internet','https://cartilha.cert.br/'],['Raciocínio Lógico','Proposições','Proposição é uma sentença declarativa à qual se pode atribuir valor verdadeiro ou falso. Perguntas e ordens não são proposições.','Fundamentos de lógica proposicional','https://www.gov.br/inep/pt-br']];
const special=[{q:'A seguridade social compreende:',o:['Saúde, previdência e assistência social','Saúde, educação e habitação','Previdência, justiça e transporte','Saúde, educação e previdência'],a:0,e:'Art. 194 da Constituição Federal.'},{q:'A saúde é:',o:['Exclusiva de contribuintes','Direito de todos e dever do Estado','Restrita a empregados','Benefício previdenciário'],a:1,e:'Art. 196 da Constituição Federal.'},{q:'A previdência social no RGPS tem caráter:',o:['Não contributivo','Exclusivamente privado','Contributivo','Assistencial'],a:2,e:'Art. 201 da Constituição Federal.'},{q:'A assistência social é prestada:',o:['Apenas a empregados','Somente a aposentados','Só a contribuintes','A quem dela necessitar, sem exigir contribuição'],a:3,e:'Art. 203 da Constituição Federal.'},{q:'O BPC é:',o:['Benefício assistencial','Aposentadoria contributiva','Seguro-desemprego','Pensão previdenciária'],a:0,e:'Lei nº 8.742/1993, art. 20.'},{q:'Qual artigo define a seguridade social?',o:['Art. 5º','Art. 194','Art. 37','Art. 225'],a:1,e:'Constituição Federal, art. 194.'},{q:'Diversidade da base de financiamento é:',o:['Benefício individual','Regra do SUS apenas','Objetivo da seguridade social','Forma de aposentadoria'],a:2,e:'Art. 194, parágrafo único.'},{q:'A previdência e a assistência social exigem ambas contribuição?',o:['Sim, sempre','Sim, para idosos','Sim, para trabalhadores','Não'],a:3,e:'A assistência social independe de contribuição.'},{q:'Universalidade da cobertura e do atendimento é:',o:['Objetivo da seguridade social','Tipo de aposentadoria','Tributo federal','Regra de concurso'],a:0,e:'Art. 194, parágrafo único, I.'},{q:'Quem nunca contribuiu pode utilizar o SUS?',o:['Não','Sim','Só após 65 anos','Só com carteira assinada'],a:1,e:'Art. 196 da Constituição Federal.'}];
let state=JSON.parse(localStorage.getItem('inss_aprova_v1')||'{}');state.scores ||= {};state.name ||= 'Estudante';state.color ||= '#1c4d91';let page='painel',lesson=0,slide=0,quiz=[],answers={},pos=0,finished=false;const $=id=>document.getElementById(id),save=()=>localStorage.setItem('inss_aprova_v1',JSON.stringify(state)),btn=(text,fn,kind='action')=>`<button class="${kind}" onclick="${fn}">${text}</button>`,medal=s=>s>=90?'🥇 Ouro':s>=80?'🥈 Prata':s>=70?'🥉 Bronze':'📖 Em preparação';function nav(){let items=[['painel','🏠 Início'],['aulas','📚 Minhas aulas'],['provas','📝 Simulados'],['boletim','🏆 Boletim e troféus'],['biblioteca','🔗 Biblioteca'],['perfil','👤 Meu perfil']];$('nav').innerHTML=items.map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}function go(p){page=p;nav();render()}function render(){document.documentElement.style.setProperty('--primary',state.color);$('username').textContent=state.name;$('title').textContent=({painel:'Meu painel',aulas:'Minhas aulas',provas:'Simulados',boletim:'Boletim e conquistas',biblioteca:'Biblioteca oficial',perfil:'Meu perfil',estudo:'Sala de aula',teste:'Avaliação da aula'})[page];let c=$('content');if(page==='painel'){let scores=Object.values(state.scores),avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;c.innerHTML=`<div class="cards"><div class="card"><h3>Aulas avaliadas</h3><h1>${scores.length}</h1></div><div class="card"><h3>Média de acertos</h3><h1>${avg}%</h1></div><div class="card"><h3>Maior conquista</h3><h2>${medal(scores.length?Math.max(...scores):0)}</h2></div></div><div class="card"><h2>Bem-vindo ao seu cursinho particular!</h2><p>Estude os slides, responda 10 questões e receba seu boletim apenas ao finalizar.</p>${btn('Começar a estudar',"go('aulas')")}</div><p class="muted">Versão inicial: conteúdo demonstrativo, ainda não corresponde ao currículo completo do edital.</p>`}else if(page==='aulas'){c.innerHTML='<div class="cards">'+disciplines.map((d,i)=>`<div class="card"><h3>${d[0]}</h3><p>${d[1]}</p><p class="muted">${state.scores[i]===undefined?'Não avaliada':medal(state.scores[i])+' • '+state.scores[i]+'%'}</p>${btn('Abrir aula',`openLesson(${i})`)}</div>`).join('')+'</div>'}else if(page==='estudo'){let d=disciplines[lesson],s=[['Conceito principal',d[2]],['Exemplo e aplicação',`Observe a diferença entre conceitos e verifique os requisitos legais antes de responder. Tema: ${d[1]}.`],['Fundamentação',`Referência de estudo: ${d[3]}. Consulte a fonte original para aprofundar o conteúdo.`],['Resumo e revisão',`Revise o conceito central: ${d[2]}`]][slide];c.innerHTML=`<p class="muted">${d[0]} • Slide ${slide+1} de 4</p><div class="progress"><div style="width:${(slide+1)*25}%"></div></div><div class="slide"><h2>${s[0]}</h2><p>${s[1]}</p></div><p><a href="${d[4]}" target="_blank" rel="noopener">📖 Consultar fonte de estudo ↗</a></p><div class="row">${btn('Anterior',"changeSlide(-1)",'secondary')}${slide<3?btn('Próximo slide',"changeSlide(1)"):btn('Responder 10 questões',"startQuiz()")}</div>`}else if(page==='teste'){let q=quiz[pos];if(!finished){c.innerHTML=`<div class="card"><p class="muted">Questão ${pos+1} de ${quiz.length} • ${Object.keys(answers).length} respondidas</p><div class="progress"><div style="width:${Object.keys(answers).length/quiz.length*100}%"></div></div><h2>${q.q}</h2>${q.o.map((o,i)=>`<label class="option"><input type="radio" name="q" ${answers[pos]===i?'checked':''} onchange="answer(${i})"> ${'ABCD'[i]}) ${o}</label>`).join('')}<div class="row">${btn('Anterior',"move(-1)",'secondary')}${pos<quiz.length-1?btn('Próxima',"move(1)"):btn('Finalizar prova',"finish()")}</div><p class="muted">O gabarito fica oculto até a finalização.</p></div>`}else{let hits=quiz.filter((q,i)=>answers[i]===q.a).length,score=Math.round(hits/quiz.length*100);c.innerHTML=`<div class="card"><h1>${medal(score)}</h1><h2>${hits}/${quiz.length} corretas • ${score}%</h2><p>Gabarito comentado liberado.</p></div>`+quiz.map((q,i)=>`<div class="card"><b>Questão ${i+1}: ${answers[i]===q.a?'✅ Acertou':'❌ Errou'}</b><p>${q.q}</p><p>Sua resposta: ${'ABCD'[answers[i]]||'—'} | Correta: ${'ABCD'[q.a]}</p><p class="muted">${q.e}</p></div>`).join('')+btn('Voltar às aulas',"go('aulas')")}}else if(page==='boletim'){c.innerHTML='<div class="cards">'+disciplines.map((d,i)=>`<div class="card"><h3>${d[0]}</h3><div class="medal">${state.scores[i]===undefined?'🔒':medal(state.scores[i]).split(' ')[0]}</div><h2>${state.scores[i]===undefined?'Pendente':state.scores[i]+'%'}</h2><p>${state.scores[i]===undefined?'Faça a avaliação da aula':medal(state.scores[i])}</p></div>`).join('')+'</div>'}else if(page==='biblioteca'){c.innerHTML=`<div class="card"><h2>Fontes oficiais</h2><p><a target="_blank" href="https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm">Constituição Federal</a></p><p><a target="_blank" href="https://www.planalto.gov.br/ccivil_03/leis/l8213cons.htm">Lei 8.213/1991</a></p><p><a target="_blank" href="https://www.planalto.gov.br/ccivil_03/leis/l8212cons.htm">Lei 8.212/1991</a></p><p><a target="_blank" href="https://www.planalto.gov.br/ccivil_03/leis/l8112cons.htm">Lei 8.112/1990</a></p><p><a target="_blank" href="https://www.gov.br/inss/pt-br">Portal INSS</a></p><p class="muted">Conferir o edital vigente antes de utilizar esta seleção como programa completo.</p></div>`}else if(page==='provas'){c.innerHTML=`<div class="card"><h2>Simulado inicial de Seguridade Social</h2><p>10 questões com correção somente após finalizar.</p>${btn('Iniciar simulado',"openLesson(0);startQuiz()")}</div><div class="card"><h3>Próximas etapas</h3><p>Simulados gerais de 20, 40, 60 e 120 questões, com banco de questões ampliado e validação editorial.</p></div>`}else if(page==='perfil'){c.innerHTML=`<div class="card"><h2>Personalização</h2><p>Nome de exibição</p><input id="name" value="${escapeHtml(state.name)}" maxlength="50"><p>Cor principal</p><input id="color" type="color" value="${state.color}"><p>${btn('Salvar perfil',"saveProfile()")}</p><p class="muted">As configurações e notas ficam salvas neste navegador. Não há conta online nem sincronização entre dispositivos nesta versão.</p></div>`}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openLesson(i){lesson=i;slide=0;go('estudo')}function changeSlide(n){slide=Math.max(0,Math.min(3,slide+n));render()}function startQuiz(){quiz=lesson===0?special:makeQuestions(lesson);answers={};pos=0;finished=false;go('teste')}function makeQuestions(i){let d=disciplines[i];let items=[['Qual é o assunto central desta aula?',d[1],'Aposentadoria por tempo de contribuição','Processo penal','Direito eleitoral'],['Qual fonte está indicada nesta aula?',d[3],'Código Penal','Código Civil','Lei de Trânsito'],['O que se recomenda antes de responder questões jurídicas?', 'Conferir a legislação aplicável','Responder por intuição','Ignorar a fonte','Memorizar sem entender']];return Array.from({length:10},(_,n)=>{let a=items[n%3];return {q:`${n+1}. ${a[0]}`,o:[a[1],a[2],a[3],a[4]],a:0,e:`Revise a aula e a fonte: ${d[3]}.`}})}function answer(i){answers[pos]=i}function move(n){pos=Math.max(0,Math.min(quiz.length-1,pos+n));render()}function finish(){if(Object.keys(answers).length<quiz.length){alert('Responda todas as 10 questões antes de finalizar.');return}finished=true;let hits=quiz.filter((q,i)=>answers[i]===q.a).length;state.scores[lesson]=Math.round(hits/quiz.length*100);save();render()}function saveProfile(){state.name=$('name').value.trim()||'Estudante';state.color=$('color').value;save();render()}nav();render();
</script></body></html>
